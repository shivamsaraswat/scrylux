name: Bug report
description: Something in Scrylux doesn't work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Before you post:** remove secrets, tokens, passwords, session cookies and personal data from
        anything you paste below. Issues here are public.

        **Found a security vulnerability?** Don't file it here. Report it privately, as described in
        [SECURITY.md](https://github.com/shivamsaraswat/scrylux/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit (`git rev-parse --short HEAD`) or the image tag you are running.
  - type: dropdown
    id: deployment
    attributes:
      label: How are you running Scrylux?
      options:
        - docker compose
        - Without Docker (pnpm)
        - Other
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: Redacted, as above.
      render: text
