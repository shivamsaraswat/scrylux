name: Setup workspace
description: >-
  Resolves the Node major version from the Dockerfile's FROM line, installs the pinned pnpm and
  that Node version, then installs the workspace from the frozen lockfile. The caller MUST check
  out the repository before using this action.

runs:
  using: composite
  steps:
    - name: Resolve Node major version from Dockerfile
      id: node
      shell: bash
      run: |
        majors="$(grep -E '^FROM (--platform=[^ ]+ )?node:' Dockerfile | sed -E 's/^FROM (--platform=[^ ]+ )?node:([0-9]+)-alpine(@sha256:[0-9a-f]{64})?( .*)?$/\2/' | sort -u)"
        count="$(printf '%s\n' "$majors" | sed '/^$/d' | wc -l | tr -d ' ')"
        if [ "$count" != "1" ]; then
          echo "::error file=Dockerfile::Expected exactly one Node major version across all 'FROM node:' lines (research.md #5), found $count: $(printf '%s' "$majors" | tr '\n' ' ')"
          exit 1
        fi
        echo "major=$majors" >> "$GITHUB_OUTPUT"

    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Install Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ steps.node.outputs.major }}
        cache: pnpm

    - name: Install workspace dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
