name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm lint
      - name: Guard the lockfile format
        run: |
          if grep -q '^---' pnpm-lock.yaml; then
            echo "::error file=pnpm-lock.yaml::pnpm-lock.yaml must be a single YAML document (see docs/ci.md#lockfile-format); a multi-document lockfile disables Dependabot alerts (dependabot-core#15904)"
            exit 1
          fi

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: threats
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: devpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d threats"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      # Throwaway, non-secret development defaults (research.md #1). .env.test is gitignored, so
      # CI supplies these directly instead.
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: threats
      DB_USER: postgres
      DB_PASSWORD: devpassword
      JWT_SECRET: ci-only-not-a-secret
      JWT_EXPIRES_IN: 8h
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm test
      # `pnpm test` runs five packages at once, and pnpm then puts the package name in front of every line of
      # output. GitHub only reads a `::warning` command at the start of a line, so a warning raised there is
      # printed but never becomes an annotation. This runs the two tests that raise one (Scrylux's own threat model
      # and the demo's) as a single project, which pnpm leaves unprefixed (docs/ci.md, "Scrylux's own threat model").
      - name: Threat model warnings
        if: ${{ !cancelled() }}
        run: pnpm --filter @scrylux/api exec vitest run test/dogfood/threat-model.test.ts test/demo/demo.test.ts
      # The browser tests run inside this required job, so they gate merges without a change to the
      # ruleset. They need the *built* app: only it serves the UI and applies the CSP.
      - name: Build
        run: pnpm build
      - name: Check the built UI for inline code and data URIs
        run: pnpm --filter @scrylux/web verify:build
      - name: Install Chromium
        run: pnpm --filter @scrylux/web exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm test:e2e
      # A failed browser test keeps a Playwright trace: its network traffic (session cookies, tokens), what was
      # typed, and snapshots of each page. The repository is public, so anyone can download it. That is safe
      # only because everything this job uses is throwaway: the values in `env` above, a database that exists
      # only for this job, and accounts the tests make. This job must never be given a real secret or pointed
      # at a real environment while this step uploads traces.
      - name: Keep the traces of failed browser tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --pull -t scrylux:ci .
