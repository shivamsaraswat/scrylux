# Messages and hints for job failures (Phase 3 Milestone 2, FR-064; the categories of ingestion, Milestone 3, FR-013). Fixed text only: no value from a request, a provider
# or a setting, only the settings' names. {prefix} becomes LLM or EMBEDDING, for the operation that failed. A hint never
# holds an address. This file is read by the API, which adds the message and hint to a job when it is read, and by the
# operator's check command, so both say the same thing. To change a hint, edit it here: apps/api/test/jobs/failures.test.ts
# holds the rules.

# Milestone 1's categories: the message is the layer's own fixed text (FAILURE_MESSAGES), and only the hint is here.
provider:
  not_configured: "Check {prefix}_PROVIDER."
  not_authorized: "Check {prefix}_API_KEY, and that the key may use this model. For Bedrock, check the role’s permissions."
  not_available: "Check {prefix}_MODEL. For Ollama, run `ollama pull <model>` first. For Bedrock, check that the model is enabled in {prefix}_REGION."
  rate_limited: "The provider is limiting requests. Wait and run the check again, or look at the limits of the account behind {prefix}_API_KEY, or choose another {prefix}_MODEL."
  provider_unavailable: "Check that the provider is up and reachable from here ({prefix}_BASE_URL or {prefix}_REGION). A slow local model may need a larger LLM_TIMEOUT."
  input_too_large: "The check sends only a few words, so the model’s context length is set too low. For Ollama, raise OLLAMA_CONTEXT_LENGTH."
  output_limit_reached: "The model used up its output limit before it answered. Check {prefix}_MODEL: a model that reasons at length may need another."
  refused: "The model declined a harmless request. Try another model: {prefix}_MODEL."
  rejected: "Check that {prefix}_MODEL names a model that can do this, and that the provider accepts what Scrylux sends it."
  invalid_output: "The model did not answer in the required shape. A small model may fail this, so try a larger one: {prefix}_MODEL."
  cancelled: "The request was stopped before it finished. Nothing is wrong with the provider."

# The job's own categories: a message and a hint each. cap_below_one_request is the message of a cap_reached failure
# whose cap was lower than the most one request could use (FR-044).
job:
  cap_reached:
    message: "The job stopped before a request that could have taken it past its token or cost cap."
    hint: "An operator can raise JOB_TOKEN_CAP or JOB_COST_CAP. A model with high prices may need a higher JOB_COST_CAP."
  cap_below_one_request:
    message: "The job's cap is lower than one request to this model needs, so nothing was sent."
    hint: "An operator can raise JOB_TOKEN_CAP or JOB_COST_CAP, or choose a model with lower prices."
  timed_out:
    message: "The job ran out of time."
    hint: "An operator can raise JOB_TIME_LIMIT. A slow local model may need a larger LLM_TIMEOUT too."
  worker_lost:
    message: "The worker running the job stopped, and the job had no runs left."
    hint: "Check the worker's logs and restart it. Start the job again."
  job_error:
    message: "The job failed because of an error in Scrylux."
    hint: "Check the worker's logs, and report it if it happens again."
  # Phase 3 Milestone 3: why a document could not be read, or stored. A category that names a bound has a text for each bound
  # it can name: unreadable (time, memory) and too_large (pages, chars). The plain entries are the fallback.
  unsupported_type:
    message: "This file is not a kind of document Scrylux can read."
    hint: "Upload a .md, .txt, .pdf or .docx file. A Word file with macros (.docm) or in the older .doc format is not read: save it as a plain .docx."
  encrypted:
    message: "This PDF is protected with a password, and Scrylux does not ask for passwords."
    hint: "Remove the protection, or save an unprotected copy, and upload that."
  damaged:
    message: "This file could not be opened. It may be damaged or cut short."
    hint: "Open it in the program that made it, save a fresh copy, and upload that."
  no_text_found:
    message: "No text was found in this file."
    hint: "It may be a scan or a set of images, which this release does not read. Upload a version that has selectable text, or paste the text in."
  too_large:
    message: "This document holds more text, or more pages, than Scrylux reads from one source."
    hint: "Split it into several documents, or ask an operator to raise SOURCE_MAX_CHARS or EXTRACT_MAX_PAGES."
  too_large_pages:
    message: "This PDF has more pages than Scrylux reads from one source."
    hint: "Split it into several documents, or ask an operator to raise EXTRACT_MAX_PAGES."
  too_large_chars:
    message: "This document holds more characters of text than Scrylux reads from one source."
    hint: "Split it into several documents, or ask an operator to raise SOURCE_MAX_CHARS."
  too_large_unpacked:
    message: "This file is far larger once it is unpacked than it was uploaded."
    hint: "Save it again with fewer or smaller embedded images and parts, or ask an operator to raise EXTRACT_UNPACKED_MB."
  unreadable:
    message: "Reading this file took more time or memory than Scrylux allows."
    hint: "Retry once, or split the document. An operator can raise EXTRACT_TIME_LIMIT or EXTRACT_MEMORY_MB."
  unreadable_time:
    message: "Reading this file took longer than the time limit for reading a document."
    hint: "Retry once, or split the document. An operator can raise EXTRACT_TIME_LIMIT."
  unreadable_memory:
    message: "Reading this file needed more memory than the limit for reading a document."
    hint: "Split the document, or ask an operator to raise EXTRACT_MEMORY_MB."
  storage_unavailable:
    message: "The stored copy of this document could not be read, or storage could not be reached."
    hint: "Check that the storage volume or bucket is available to the worker (STORAGE_BACKEND and the STORAGE_ settings), then retry."
  document_space_full:
    message: "Adding this document would pass the space this install allows for documents."
    hint: "Delete sources that are no longer needed, or ask an operator to raise DOCUMENT_SPACE, then retry."

# A hint that depends on the job kind. A model that refuses a chunk as too large is a different problem for an embedding of
# a document than for the provider check (Milestone 1's hint is about the check's few words).
kinds:
  ingest_source:
    input_too_large: "This embedding model does not accept Scrylux's chunk size of 2,000 characters. Choose an embedding model that accepts at least 2,048 tokens: EMBEDDING_MODEL. For Ollama, keep the context at 2,048 or more."
  refresh_embeddings:
    input_too_large: "This embedding model does not accept Scrylux's chunk size of 2,000 characters. Choose an embedding model that accepts at least 2,048 tokens: EMBEDDING_MODEL. For Ollama, keep the context at 2,048 or more."

# What a source shows when its ingestion was cancelled from the Jobs page (FR-044). Nothing failed.
source:
  cancelled:
    message: "Processing was cancelled before this document was ready."
    hint: "Retry to process it again."
