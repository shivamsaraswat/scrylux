# Scrylux, the released image and its database. This is the file a release attaches as `docker-compose.yml`
# (`docker compose up -d`). It is not the contributor's file: `docker-compose.yml` builds from source and publishes the
# database port for tests.
#
# The defaults below are for LOCAL USE ONLY. Before this is reachable from anywhere but your own machine:
#   - set DB_PASSWORD, JWT_SECRET, ADMIN_USERNAME and ADMIN_PASSWORD (export them, or put them in a `.env` file next to
#     this file); the sign-in below is `admin` / `admin`, and anyone who knows JWT_SECRET can forge a login token;
#   - the app is published on 127.0.0.1 only, and it does not terminate TLS: put a proxy that does in front of it, and set
#     TRUST_PROXY (see the README);
#   - the database publishes no port, and must keep publishing none.
# The README's quickstart says the same. SCRYLUX_VERSION chooses the image's version; this file's default is the version of
# the release it is attached to.
services:
  db:
    # pgvector stores the embeddings of Phase 3 Milestone 3. Its image is Debian-based, not Alpine: a volume made by v0.1's image is
    # repaired by migration 017's reindex, and docs/install.md#upgrading-to-v02 says what to do.
    image: pgvector/pgvector:0.8.7-pg16-trixie@sha256:9cf8b511f0e9a2c209b61430fc139f1ab9c75edbb31fb1751db6617b246a897a
    environment:
      POSTGRES_DB: threats
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d threats"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    image: ghcr.io/shivamsaraswat/scrylux:${SCRYLUX_VERSION:-0.1.0}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: threats
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-devpassword}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      # AI providers (docs/ai-providers.md). All empty by default, which leaves AI off, as in v0.1. The app only reports them:
      # the provider keys (LLM_API_KEY, EMBEDDING_API_KEY) are given to the worker alone, which is the one process that talks to a provider.
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_LOCAL: ${LLM_LOCAL:-}
      LLM_REGION: ${LLM_REGION:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_LOCAL: ${EMBEDDING_LOCAL:-}
      EMBEDDING_REGION: ${EMBEDDING_REGION:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-}
      LLM_PRICE_INPUT: ${LLM_PRICE_INPUT:-}
      LLM_PRICE_OUTPUT: ${LLM_PRICE_OUTPUT:-}
      EMBEDDING_PRICE_INPUT: ${EMBEDDING_PRICE_INPUT:-}
      # Background jobs (docs/install.md). All empty by default, which uses the defaults. The API copies the caps, runs and
      # time limit onto each job it queues and enforces the limits; the worker runs the jobs.
      JOB_TOKEN_CAP: ${JOB_TOKEN_CAP:-}
      JOB_COST_CAP: ${JOB_COST_CAP:-}
      JOB_MAX_RUNS: ${JOB_MAX_RUNS:-}
      JOB_TIME_LIMIT: ${JOB_TIME_LIMIT:-}
      JOBS_PER_ACCOUNT: ${JOBS_PER_ACCOUNT:-}
      PROVIDER_CHECK_COOLDOWN: ${PROVIDER_CHECK_COOLDOWN:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-}
      WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-}
      # Documents (Phase 3 Milestone 3, docs/install.md). All empty by default, which uses the defaults. The app checks the sizes
      # and counts, and stores the uploads; the worker reads them, extracts the text and embeds it. The document space and the
      # storage settings are the same for both.
      SOURCE_MAX_MB: ${SOURCE_MAX_MB:-}
      SOURCES_PER_THREAT_MODEL: ${SOURCES_PER_THREAT_MODEL:-}
      INGESTION_JOBS_PER_ACCOUNT: ${INGESTION_JOBS_PER_ACCOUNT:-}
      DOCUMENT_SPACE: ${DOCUMENT_SPACE:-}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_PREFIX: ${STORAGE_S3_PREFIX:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_FORCE_PATH_STYLE: ${STORAGE_S3_FORCE_PATH_STYLE:-}
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:-}
    volumes:
      # The stored originals of the documents that are not ready yet, with STORAGE_BACKEND=local (the default). Shared by the app
      # and the worker; unused, and empty, with an S3-compatible service.
      - storage:/app/apps/api/storage
    extra_hosts:
      # So a model server on the host (Ollama) is reachable as host.docker.internal on Linux too.
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  # The worker (Phase 3): runs jobs off the request path, from the same image as the app. It publishes no port. The image of the
  # next release is the first to hold it (`dist/worker.js`): the release checklist (docs/releasing.md) sets this file's default
  # version to that release, so the file attached to a release always names an image that has the worker.
  worker:
    image: ghcr.io/shivamsaraswat/scrylux:${SCRYLUX_VERSION:-0.1.0}
    command: ["node", "dist/worker.js"]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: threats
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-devpassword}
      # AI providers (docs/ai-providers.md), with the provider keys: the worker is the one process that uses them (the app
      # holds none). All empty by default, which leaves AI off, as in v0.1.
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_LOCAL: ${LLM_LOCAL:-}
      LLM_REGION: ${LLM_REGION:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_LOCAL: ${EMBEDDING_LOCAL:-}
      EMBEDDING_REGION: ${EMBEDDING_REGION:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-}
      LLM_PRICE_INPUT: ${LLM_PRICE_INPUT:-}
      LLM_PRICE_OUTPUT: ${LLM_PRICE_OUTPUT:-}
      EMBEDDING_PRICE_INPUT: ${EMBEDDING_PRICE_INPUT:-}
      # Background jobs (docs/install.md). All empty by default, which uses the defaults. The API copies the caps, runs and
      # time limit onto each job it queues and enforces the limits; the worker runs the jobs.
      JOB_TOKEN_CAP: ${JOB_TOKEN_CAP:-}
      JOB_COST_CAP: ${JOB_COST_CAP:-}
      JOB_MAX_RUNS: ${JOB_MAX_RUNS:-}
      JOB_TIME_LIMIT: ${JOB_TIME_LIMIT:-}
      JOBS_PER_ACCOUNT: ${JOBS_PER_ACCOUNT:-}
      PROVIDER_CHECK_COOLDOWN: ${PROVIDER_CHECK_COOLDOWN:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-}
      WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-}
      # Documents (Phase 3 Milestone 3, docs/install.md). All empty by default, which uses the defaults. The worker reads the stored
      # originals, extracts their text in a child process that holds no secret, and embeds it. The document space and the storage
      # settings are the same as the app's.
      DOCUMENT_SPACE: ${DOCUMENT_SPACE:-}
      SOURCE_MAX_CHARS: ${SOURCE_MAX_CHARS:-}
      EXTRACT_TIME_LIMIT: ${EXTRACT_TIME_LIMIT:-}
      EXTRACT_MEMORY_MB: ${EXTRACT_MEMORY_MB:-}
      EXTRACT_UNPACKED_MB: ${EXTRACT_UNPACKED_MB:-}
      EXTRACT_MAX_PAGES: ${EXTRACT_MAX_PAGES:-}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_PREFIX: ${STORAGE_S3_PREFIX:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_FORCE_PATH_STYLE: ${STORAGE_S3_FORCE_PATH_STYLE:-}
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:-}
    volumes:
      # The stored originals of the documents that are not ready yet, with STORAGE_BACKEND=local (the default). Shared by the app
      # and the worker; unused, and empty, with an S3-compatible service.
      - storage:/app/apps/api/storage
    extra_hosts:
      # So a model server on the host (Ollama) is reachable as host.docker.internal on Linux too.
      - "host.docker.internal:host-gateway"
    healthcheck:
      # The image has no curl; Node does the request. 3001 is WORKER_HEALTH_PORT's default: change both together.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  storage:
