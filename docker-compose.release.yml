# Scrylux, the released image and its database. This is the file a release attaches as `docker-compose.yml`
# (`docker compose up -d`). It is not the contributor's file: `docker-compose.yml` builds from source and publishes the
# database port for tests.
#
# The defaults below are for LOCAL USE ONLY. Before this is reachable from anywhere but your own machine:
#   - set DB_PASSWORD, JWT_SECRET, ADMIN_USERNAME and ADMIN_PASSWORD (export them, or put them in a `.env` file next to
#     this file); the sign-in below is `admin` / `admin`, and anyone who knows JWT_SECRET can forge a login token;
#   - the app is published on 127.0.0.1 only, and it does not terminate TLS: put a proxy that does in front of it, and set
#     TRUST_PROXY (see the README);
#   - the database publishes no port, and must keep publishing none.
# The README's quickstart says the same. SCRYLUX_VERSION chooses the image's version; this file's default is the version of
# the release it is attached to.
services:
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: threats
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d threats"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    image: ghcr.io/shivamsaraswat/scrylux:${SCRYLUX_VERSION:-0.1.0}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: threats
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-devpassword}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      # AI providers (docs/ai-providers.md). All empty by default, which leaves AI off, as in v0.1.
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_LOCAL: ${LLM_LOCAL:-}
      LLM_REGION: ${LLM_REGION:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_LOCAL: ${EMBEDDING_LOCAL:-}
      EMBEDDING_REGION: ${EMBEDDING_REGION:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-}
      LLM_PRICE_INPUT: ${LLM_PRICE_INPUT:-}
      LLM_PRICE_OUTPUT: ${LLM_PRICE_OUTPUT:-}
      EMBEDDING_PRICE_INPUT: ${EMBEDDING_PRICE_INPUT:-}
    extra_hosts:
      # So a model server on the host (Ollama) is reachable as host.docker.internal on Linux too.
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
