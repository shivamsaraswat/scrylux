# Prices in US dollars per million tokens (Principle IV, FR-033a). Each entry says when its price was checked and where
# it is published. Models are matched by their exact id; an entry never applies to a model it was not checked for. A
# model with no entry has an unknown cost, and an operator's own price (LLM_PRICE_INPUT and LLM_PRICE_OUTPUT) wins
# over this list. Embedding models have an input price only.
#
# Optional tier: above_input_tokens and above are chosen per attempt, by the attempt's input tokens.
#
# To add or update a price: copy it from the source page, set `checked` to the day you did, and keep the source address.
# Never estimate a price: leave the model out.

anthropic:
  - { model: claude-fable-5-1, input: 10, output: 50, checked: 2026-10-21, source: https://platform.claude.com/docs/en/about-claude/pricing }
