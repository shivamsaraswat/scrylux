packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@google/genai': false
  esbuild: true
  protobufjs: false
# pdfjs-dist lists @napi-rs/canvas as an optional dependency, for rendering pages. Scrylux only reads text, so the native
# package stays out of the lockfile and the image (Phase 3 Milestone 3, research #4).
ignoredOptionalDependencies:
  - '@napi-rs/canvas'
# Keeps pnpm-lock.yaml a single YAML document, instead of the two-document stream pnpm >=11
# writes by default when it manages its own version. The two-document format makes GitHub's
# dependency graph report zero dependencies and silently disables Dependabot alerts
# (dependabot-core#15904). Trade-off: pnpm no longer checks the running pnpm against
# `packageManager`; CI and the Docker build compensate by installing that exact version via
# Corepack (see docs/ci.md#lockfile-format). Revert once #15904 ships.
pmOnFail: ignore

